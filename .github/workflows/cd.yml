name: Forafa-App Continuous Deployment (CD)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. BUILD & PACKAGE ARTIFACTS
  # ============================================================================
  package-release:
    name: Package Production Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Build Frontend Production Bundle
        working-directory: client
        run: |
          npm ci || npm install
          npm run build

      - name: Package Backend Service
        run: |
          mkdir -p release/backend
          cp -r server/* release/backend/
          # Hapus file lokal atau environment sensitif jika ada
          rm -f release/backend/.env
          cp server/.env.example release/backend/.env.production.example

      - name: Archive Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-bundle
          path: client/dist
          retention-days: 14

      - name: Archive Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-bundle
          path: release/backend
          retention-days: 14

  # ============================================================================
  # 2. DEPLOYMENT & HEALTH VERIFICATION
  # ============================================================================
  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: package-release
    environment: production

    steps:
      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-bundle
          path: deploy/client

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-production-bundle
          path: deploy/server

      - name: Verify Bundle Integrity
        run: |
          echo "📦 Memverifikasi struktur file deployment..."
          test -f deploy/client/index.html || { echo "Frontend bundle missing index.html"; exit 1; }
          test -f deploy/server/router.php || { echo "Backend bundle missing router.php"; exit 1; }
          test -f deploy/server/index.php || { echo "Backend bundle missing index.php"; exit 1; }
          echo "✅ File bundle lengkap dan siap dideploy."

      - name: Deployment Step (Simulated / Webhook / Cloud)
        run: |
          echo "🚀 Menerapkan rilis Forafa-App ke server target..."
          echo "Target Environment: ${{ github.event.inputs.target_environment || 'production' }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"

      - name: Emit Deployment Summary
        if: always()
        run: |
          echo "### 🌐 Forafa-App Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Deployment Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`${{ github.event.inputs.target_environment || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Komponen | Tipe Paket | Output |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | SPA Static Bundle (Vite) | \`client/dist\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | PHP Native Service | \`server/src\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Schema | MySQL DDL Migrations | \`database.sql\` |" >> $GITHUB_STEP_SUMMARY
